[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pragmatic, low-noise set: pycodestyle errors, pyflakes, import sorting,
# bugbear, and pyupgrade. Honors the existing code style.
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures use long inline dict/JSON literals that read fine over 100 cols.
"tests/*" = ["E501"]
